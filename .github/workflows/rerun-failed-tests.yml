
name: Rerun failed regression tests

on:
  workflow_run:
    workflows:
      - Scheduled regression
    branches:
      - master
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  rerun-failed:
    name: Rerun failed regression tests
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Checkout the exact commit from the original regression run.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Java 11 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Download the artifact from the exact triggering regression run.
      - name: Download failed TestNG suite
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: failed-testng-suite-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/downloaded-failures
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Dynamically discover and validate the downloaded XML.
      - name: Locate and validate failed TestNG suite
        id: locate-suite
        if: always()
        shell: pwsh
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'downloaded-failures'

          $files = @(
            Get-ChildItem -Path $downloadDirectory `
              -Filter 'testng-failed.xml' `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {
            throw "No failed TestNG XML was found in the downloaded artifact."
          }

          if ($files.Count -gt 1) {
            $files | ForEach-Object { Write-Host $_.FullName }
            throw "Multiple failed TestNG XML files found. Cannot safely select one."
          }

          $failedXml = $files[0]

          if ($failedXml.Length -eq 0) {
            throw "Downloaded TestNG failed-suite XML is empty."
          }

          try {
            [xml]$parsedXml = Get-Content -LiteralPath $failedXml.FullName -Raw -ErrorAction Stop
          }
          catch {
            throw "Downloaded TestNG XML is not valid XML: $($_.Exception.Message)"
          }

          if ($parsedXml.DocumentElement.LocalName -ne 'suite') {
            throw "Downloaded XML does not have a TestNG suite as its root element."
          }

          $failedXmlPath = $failedXml.FullName

          "path=$failedXmlPath" >> $env:GITHUB_OUTPUT

          Write-Host "Valid TestNG failed suite found: $failedXmlPath"
          Write-Host "File size: $($failedXml.Length) bytes"

          "Failed suite: $failedXmlPath" >> $env:GITHUB_STEP_SUMMARY

      # Compile without cleaning the downloaded artifact.
      - name: Compile framework and test sources
        run: mvn --batch-mode --no-transfer-progress test-compile

      # Execute only the failed TestNG methods.
      - name: Execute only failed test cases
        run: >-
          mvn --batch-mode --no-transfer-progress
          "-Dapp.env=DEV"
          "-Dbrowser=CHROME"
          "-Dtestng.suite=${{ steps.locate-suite.outputs.path }}"
          test

      # Upload rerun results separately.
      - name: Upload rerun reports, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-rerun-results-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            target/surefire-reports/
            target/artifacts/
          retention-days: 14
          if-no-files-found: warn
