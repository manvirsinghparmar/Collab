
name: Rerun failed regression tests

on:
  workflow_run:
    workflows:
      - Scheduled regression
    branches:
      - master
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  rerun-failed:
    name: Rerun failed regression tests
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Checkout the exact commit from the original regression run
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Java 11 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Download failed XML from the exact regression run
      - name: Download failed TestNG suite
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: failed-testng-suite-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: target/failed-suite
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Check whether failed XML exists
      - name: Check failed XML
        id: check
        shell: pwsh
        run: |
          $file = "target/failed-suite/testng-failed.xml"

          if ((Test-Path $file) -and (Get-Item $file).Length -gt 0) {
              "has_failures=true" >> $env:GITHUB_OUTPUT
              Write-Host "Failed test cases found."
          }
          else {
              "has_failures=false" >> $env:GITHUB_OUTPUT
              Write-Host "No failed TestNG XML found."
          }

      # Compile without deleting downloaded failed XML
      - name: Compile framework and test sources
        if: steps.check.outputs.has_failures == 'true'
        run: mvn --batch-mode --no-transfer-progress test-compile

      # Execute only failed TestNG methods
      - name: Execute only failed test cases
        if: steps.check.outputs.has_failures == 'true'
        run: >-
          mvn --batch-mode --no-transfer-progress
          "-Dapp.env=DEV"
          "-Dbrowser=CHROME"
          "-Dtestng.suite=target/failed-suite/testng-failed.xml"
          test

      # Upload rerun results separately
      - name: Upload rerun reports, logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-rerun-results-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            target/surefire-reports/
            target/artifacts/
          retention-days: 14
          if-no-files-found: warn
